name: Release

# Every push to main: run CI, work out the next SemVer version from the
# Conventional Commit messages since the last tag, build it, and after a
# release manager approves the pypi environment, upload it to PyPI and create
# the tag and GitHub Release. Nothing is committed back to main: the tag is the
# source of truth and the version in the repo stays at 0.0.0.

on:
  push:
    branches: [main]

permissions: {}

# One release at a time. A newer run replaces a queued one and picks up its
# commits, so no version is skipped or published twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags
          persist-credentials: false
      - id: next
        # Separate assignment so a script failure fails the step.
        run: |
          version=$(python3 scripts/operations/release_version.py next)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.next.outputs.version == ''
        run: echo "::notice::No feat, fix, perf or breaking change since the last release. Nothing to publish."

  build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false # no shared cache in a release build
      - name: Set the version
        run: |
          uv version "$VERSION" --frozen
          sed -i "s/^__version__ = \"0.0.0\"$/__version__ = \"$VERSION\"/" src/nomba/__init__.py
          grep -qx "__version__ = \"$VERSION\"" src/nomba/__init__.py
      - run: uv build --out-dir dist
      - name: Check the built wheel
        run: |
          uv venv "$RUNNER_TEMP/app"
          uv pip install --python "$RUNNER_TEMP/app" dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/app/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke/smoke.py" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nomba/
    permissions:
      contents: write # create the tag and GitHub Release
      id-token: write # PyPI trusted publishing (OIDC)
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Check the version isn't on PyPI yet
        # If a run uploaded but failed to tag, create the v$VERSION release on
        # the commit PyPI serves, then re-run this workflow.
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nomba/$VERSION/json")
          if [ "$status" = "200" ]; then
            echo "::error::nomba $VERSION is already on PyPI but not tagged. Create the v$VERSION release on the commit it was built from, then re-run this workflow."
            exit 1
          elif [ "$status" != "404" ]; then
            echo "::error::Unexpected PyPI response $status"
            exit 1
          fi
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      - name: Tag and create GitHub Release
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
