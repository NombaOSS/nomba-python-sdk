name: CI

on:
  push:
    branches-ignore: [main] # release.yml runs CI on main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/dist/
          retention-days: 1

  smoke:
    name: smoke (${{ matrix.python-version }})
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - if: matrix.python-version != '3.12'
        run: |
          uv sync --locked
          uv run pytest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/dist
      - name: Install the built wheel into an empty environment
        run: |
          uv venv "$RUNNER_TEMP/app"
          uv pip install --python "$RUNNER_TEMP/app" "$RUNNER_TEMP"/dist/*.whl
      - name: Import and use the installed package
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/app/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke/smoke.py"'
